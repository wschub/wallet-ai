[project]
name = "wallet-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wschub", email = "dev.wschub@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.156.2",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pgvector>=0.5.1",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wallet-ai = "wallet_ai:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
