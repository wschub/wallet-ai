openapi: 3.0.3
info:
  title: Wallet AI API
  description: Wallet simulado con asistente financiero (hexagonal, SSE, borradores con confirmación separada y handles opacos)
  version: 1.0.0
tags:
  - name: auth
  - name: accounts
  - name: recipients
  - name: drafts
  - name: chat
  - name: audit
paths:
  /auth/login:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/me:
    get:
      tags: [accounts]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saldo derivado del ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /accounts/me/transactions:
    get:
      tags: [accounts]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactions'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recipients:
    get:
      tags: [recipients]
      summary: Buscar destinatarios. Devuelve handle opaco y nombre enmascarado. Compartido con MCP find_recipient.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Nombre a buscar. Minimo 3 caracteres.
          schema: { type: string, minLength: 3 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Destinatarios con handle opaco y nombre enmascarado (maximo 5)
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecipients'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /drafts:
    post:
      tags: [drafts]
      summary: Crear borrador con recipient_id (handle). Nunca acepta ID de cuenta directo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftCreate'
      responses:
        '201':
          description: >-
            Borrador creado en estado 'pendiente'. No mueve dinero ni escribe en
            el ledger: eso ocurre solo en /drafts/{id}/confirm.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Handle desconocido, vencido o emitido a otro usuario (mismo error generico)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [drafts]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Borradores propios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Draft'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drafts/{id}:
    get:
      tags: [drafts]
      summary: Obtener un borrador propio. Devuelve 404 si no existe o es ajeno.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Borrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /drafts/{id}/confirm:
    post:
      tags: [drafts]
      summary: >-
        Confirmación separada. Único punto donde se mueve dinero. La expiración
        se evalúa al confirmar (si venció, el borrador pasa a 'expirada' y se
        responde 409). La confirmación es idempotente: confirmar un borrador ya
        confirmado devuelve el MISMO transaction_id (200) sin crear una nueva
        transacción en el ledger. Un borrador rechazado o expirado responde 409;
        un borrador ajeno responde 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Transferencia ejecutada (o ya confirmada; mismo transaction_id)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferExecuted'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /drafts/{id}/reject:
    post:
      tags: [drafts]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Rechazado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/stream:
    post:
      tags: [chat]
      summary: SSE. trace_id en header X-Trace-Id y en primer evento SSE.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: text/event-stream
          headers:
            X-Trace-Id:
              schema: { type: string }
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /audit:
    get:
      tags: [audit]
      summary: Solo compliance, paginado
      security:
        - bearerAuth: []
      parameters:
        - name: trace_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Eventos paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEvents'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized: { description: No autorizado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Prohibido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    BadRequest: { description: Petición inválida (query corta o monto no decimal), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: No encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Conflicto/ya usado/expirado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  headers:
    X-Trace-Id:
      description: Identificador de traza; presente en TODAS las respuestas (tambien 401/403/404/409).
      schema: { type: string }
  schemas:
    LoginRequest: { type: object, required: [email,password], properties: { email: {type:string}, password: {type:string} } }
    TokenResponse: { type: object, required: [access_token], properties: { access_token: {type:string} } }
    AccountBalance: { type: object, required: [account_id,balance,currency], properties: { account_id: {type:string,format:uuid}, balance: {type:string}, currency: {type:string} } }
    Transaction: { type: object, required: [id,amount,type,created_at], properties: { id: {type:string,format:uuid}, amount: {type:string}, type: {type:string,enum:[DEBIT,CREDIT]}, created_at: {type:string,format:date-time} } }
    PaginatedTransactions: { type: object, required: [items], properties: { items: {type:array,items:{$ref:'#/components/schemas/Transaction'}}, next_cursor: {type:string,nullable:true} } }
    Recipient: { type: object, required: [recipient_id,name_masked,expires_at], properties: { recipient_id: {type:string,description:"Handle opaco (no es un id de cuenta)"}, name_masked: {type:string,description:"Nombre enmascarado, p.ej. 'María G***'"}, expires_at: {type:string,format:date-time,description:"El handle vence a los 15 minutos"} } }
    PaginatedRecipients: { type: object, required: [items], properties: { items: {type:array,items:{$ref:'#/components/schemas/Recipient'},maxItems:5}, next_cursor: {type:string,nullable:true} } }
    DraftCreate: { type: object, required: [recipient_id,amount], properties: { recipient_id: {type:string,description:"Handle opaco emitido por /recipients o find_recipient. Nunca un id de cuenta."}, amount: {type: string, pattern: '^[0-9]+([.][0-9]{1,2})?$', description: "NUMERIC(18,2) como string decimal positivo"} } }
    Draft: { type: object, required: [id,status,amount,expires_at], properties: { id: {type:string,format:uuid}, status: {type:string,enum:[pendiente,confirmada,rechazada,expirada]}, amount: {type:string}, expires_at: {type:string,format:date-time}, confirmed_at: {type:string,format:date-time,nullable:true}, ledger_transaction_id: {type:string,format:uuid,nullable:true}, created_at: {type:string,format:date-time,nullable:true} } }
    TransferExecuted: { type: object, required: [transaction_id,draft_id], properties: { transaction_id: {type:string,format:uuid}, draft_id: {type:string,format:uuid} } }
    ChatRequest: { type: object, required: [message], properties: { message: {type:string} } }
    AuditEvent: { type: object, required: [trace_id,event_type,created_at], properties: { trace_id: {type:string}, event_type: {type:string}, payload: {type:object}, reason: {type:string}, created_at: {type:string,format:date-time} } }
    PaginatedAuditEvents: { type: object, required: [items], properties: { items: {type:array,items:{$ref:'#/components/schemas/AuditEvent'}}, next_cursor: {type:string,nullable:true} } }
    Error: { type: object, required: [error], properties: { error: {type:string}, detail: {type:string} } }
