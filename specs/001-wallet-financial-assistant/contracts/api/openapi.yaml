openapi: 3.0.3
info:
  title: Wallet AI API
  description: Wallet simulado con asistente financiero (hexagonal, SSE, borradores con confirmación separada)
  version: 1.0.0
tags:
  - name: auth
  - name: accounts
  - name: drafts
  - name: chat
  - name: audit
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login con usuario sintético
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/me:
    get:
      tags: [accounts]
      summary: Cuenta y saldo derivado del ledger (solo propia)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saldo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/me/transactions:
    get:
      tags: [accounts]
      summary: Movimientos propios
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de movimientos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactions'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /drafts:
    post:
      tags: [drafts]
      summary: Crear borrador de transferencia (prepara, no ejecuta)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftCreate'
      responses:
        '201':
          description: Borrador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [drafts]
      summary: Listar borradores propios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de borradores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Draft'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /drafts/{id}/confirm:
    post:
      tags: [drafts]
      summary: Confirmación explícita y separada (solo humano). El modelo/MCP no accede a este endpoint. Expiración evaluada al confirmar. Clave de idempotencia = ID del borrador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transferencia ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferExecuted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya confirmada, expirada o en conflicto de idempotencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /drafts/{id}/reject:
    post:
      tags: [drafts]
      summary: Rechazar borrador propio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Borrador rechazado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /chat/stream:
    post:
      tags: [chat]
      summary: Chat con asistente por SSE (streaming). No puede confirmar borradores. trace_id se devuelve en el primer evento SSE y en header.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Stream SSE. Header incluye X-Trace-Id. Primer evento SSE incluye trace_id.
          headers:
            X-Trace-Id:
              description: Identificador de traza
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /audit:
    get:
      tags: [audit]
      summary: Consulta de auditoría. SOLO compliance. Paginación con limit+cursor.
      security:
        - bearerAuth: []
      parameters:
        - name: trace_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista paginada de eventos de auditoría (append-only, PII enmascarado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEvents'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Prohibido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    TokenResponse:
      type: object
      required: [access_token]
      properties:
        access_token: { type: string }
    AccountBalance:
      type: object
      required: [account_id, balance, currency]
      properties:
        account_id: { type: string, format: uuid }
        balance: { type: string, description: "Decimal como string (NUMERIC(18,2))" }
        currency: { type: string }
    Transaction:
      type: object
      required: [id, amount, type, created_at]
      properties:
        id: { type: string, format: uuid }
        amount: { type: string, description: "Decimal como string (NUMERIC(18,2))" }
        type: { type: string, enum: [DEBIT, CREDIT] }
        created_at: { type: string, format: date-time }
    PaginatedTransactions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        next_cursor:
          type: string
          nullable: true
    DraftCreate:
      type: object
      required: [to_recipient_id, amount]
      properties:
        to_recipient_id: { type: string, description: "Identificador opaco del destinatario" }
        amount: { type: string, description: "Decimal como string (NUMERIC(18,2))" }
    Draft:
      type: object
      required: [id, status, amount, expires_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pendiente, confirmada, rechazada, expirada] }
        amount: { type: string, description: "Decimal como string (NUMERIC(18,2))" }
        to_recipient_id: { type: string }
        expires_at: { type: string, format: date-time }
    TransferExecuted:
      type: object
      required: [transaction_id, draft_id]
      properties:
        transaction_id: { type: string, format: uuid }
        draft_id: { type: string, format: uuid }
    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AuditEvent:
      type: object
      required: [trace_id, event_type, created_at]
      properties:
        trace_id: { type: string }
        event_type: { type: string }
        payload: { type: object }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    PaginatedAuditEvents:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          nullable: true
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
