name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
      LLM_MODEL: fake
      EMBEDDING_PROVIDER: fake
      RERANKER_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
